[project]
name = "handoff-bench"
version = "0.1.0"
description = "Benchmark: do failures cross the subagent → orchestrator boundary (exactly-once under delegation)?"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.0",
]

[project.scripts]
stand = "handoff_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebook = [
    "jupyterlab>=4.6.6",
    "jupytext>=1.19.6",
]
