# Statement with the key (60-63) with Claude Code (Opus, Pro subscription) as the orchestrator
# and our Haiku subagent: does the orchestrator carry the subagent's key into the next goal when
# nobody asks it to? Same worlds as haiku-code-key and haiku-hidden-v2/v3 (templates 1-3,
# seeds 1-7). Stopped by the usage limit: `stand batch <this> --resume` after reset.
run_id: harness-cc-code-key
orchestrator:
  harness: claude_code
  model: opus
  binary: /opt/homebrew/bin/claude
model:
  model: anthropic/claude-haiku-5.5
  provider: anthropic
cells: [60, 61, 62, 63]
templates: [1, 2, 3]
seeds: [1, 2, 3, 4, 5, 6, 7]
parallel: 1
# Includes what the harness reports as the API-equivalent cost; on a subscription it is not charged.
budget_usd: 8
